<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Arial, sans-serif">
  <title>Diagram alur spending cap</title>
  <desc>Gaji masuk, lalu dipisah lewat spending cap: nominal tetap ke rekening belanja, sisanya otomatis ke investasi.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"></path>
    </marker>
  </defs>
  <rect width="720" height="460" fill="#ffffff"></rect>
  <rect x="270" y="20" width="180" height="60" rx="10" fill="#f5f2ea" stroke="#a89f8a" stroke-width="1.5"></rect>
  <text x="360" y="55" text-anchor="middle" font-size="16" font-weight="600" fill="#2c2c2a">Gaji Masuk</text>
  <line x1="360" y1="80" x2="360" y2="118" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"></line>
  <rect x="210" y="120" width="300" height="72" rx="10" fill="#2c2c2a"></rect>
  <text x="360" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Tentukan Spending Cap</text>
  <text x="360" y="172" text-anchor="middle" font-size="13" fill="#d3d1c7">nominal tetap, bukan persentase</text>
  <path d="M 300 192 L 300 220 L 170 220 L 170 258" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"></path>
  <path d="M 420 192 L 420 220 L 550 220 L 550 258" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"></path>
  <rect x="60" y="260" width="220" height="90" rx="10" fill="#faeeda" stroke="#ba7517" stroke-width="1.5"></rect>
  <text x="170" y="295" text-anchor="middle" font-size="15" font-weight="600" fill="#412402">Rekening Belanja</text>
  <text x="170" y="318" text-anchor="middle" font-size="12" fill="#633806">nominal cap, tetap tiap bulan</text>
  <text x="170" y="336" text-anchor="middle" font-size="12" fill="#633806">habis di bulan itu, tidak nambah</text>
  <rect x="440" y="260" width="220" height="90" rx="10" fill="#eaf3de" stroke="#639922" stroke-width="1.5"></rect>
  <text x="550" y="295" text-anchor="middle" font-size="15" font-weight="600" fill="#173404">Investasi / Tabungan</text>
  <text x="550" y="318" text-anchor="middle" font-size="12" fill="#27500a">sisa penghasilan, otomatis</text>
  <text x="550" y="336" text-anchor="middle" font-size="12" fill="#27500a">membesar seiring gaji naik</text>
  <line x1="170" y1="350" x2="170" y2="385" stroke="#c7c2b0" stroke-width="1.5" stroke-dasharray="4 3"></line>
  <line x1="550" y1="350" x2="550" y2="385" stroke="#c7c2b0" stroke-width="1.5" stroke-dasharray="4 3"></line>
  <rect x="150" y="388" width="420" height="50" rx="8" fill="#f1efe8" stroke="#d3d1c7" stroke-width="1"></rect>
  <text x="360" y="410" text-anchor="middle" font-size="12.5" fill="#444441">Gaji naik → nominal cap tetap sama →</text>
  <text x="360" y="427" text-anchor="middle" font-size="12.5" fill="#444441">porsi investasi yang membesar, bukan gaya hidup</text>
</svg>